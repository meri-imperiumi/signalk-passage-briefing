name: Node CI

on: [push, pull_request]

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]
    steps:
    - uses: actions/checkout@v3.0.2
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3.1.1
      with:
        node-version: ${{ matrix.node-version }}
    - run: npm install
    # node:sqlite is flag-gated before Node 22.13; the flag is a
    # no-op warning on newer versions, so every matrix entry can
    # carry it
    - run: npm test
      env:
        CI: true
        NODE_OPTIONS: --experimental-sqlite
